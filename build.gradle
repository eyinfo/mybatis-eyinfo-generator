plugins {
    id 'java-library'
}

group 'org.eyinfo'
version '1.0.0'

repositories {
    mavenCentral()
    maven {
        url 'https://mvn.geease.com/repository/cloud-group/'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    compileOnly 'org.mybatis.generator:mybatis-generator-core:1.4.2'
}

apply from: 'nexus-push.gradle'
